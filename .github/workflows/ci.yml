name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:commits
      - name: Check squash commit subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.11.12
          uv sync --frozen --extra live --group native
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpixman-1-dev pkg-config
      - if: runner.os == 'Linux'
        run: uv run --frozen --group native python tools/build_native.py --pixman
      - if: runner.os == 'Windows'
        run: uv run --frozen --group native python tools/build_native.py
  weston:
    name: Weston integration (CPU, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libwayland-dev wayland-protocols libpixman-1-dev libinput-dev libevdev-dev libxkbcommon-dev libudev-dev libdrm-dev libcairo2-dev libpango1.0-dev libpng-dev libseat-dev
          python -m pip install uv==0.11.12
          uv sync --frozen --group native
      - run: uv run --frozen --group native python tools/build_native.py --pixman
      - run: uv run --frozen python tools/build_weston.py
      - run: uv run --frozen python tools/validate_weston.py
      - run: uv run --frozen python tools/validate_weston.py --nested --report results/weston-nested.json
