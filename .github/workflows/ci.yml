name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:commits
      - name: Check squash commit subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.11.12
          uv sync --frozen --extra live --group native
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash .github/install_linux_packages.sh libpixman-1-dev pkg-config
      - if: runner.os == 'Linux'
        run: uv run --frozen --group native python tools/build_native.py --pixman
      - if: runner.os == 'Windows'
        id: windows_native
        run: uv run --frozen --group native python tools/build_native.py --ddi
      - name: Diagnose failed Windows CPU execution
        if: failure() && runner.os == 'Windows' && steps.windows_native.outcome == 'failure'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Manufacturer,Name,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json
          [ordered]@{
            avx = [System.Runtime.Intrinsics.X86.Avx]::IsSupported
            avx2 = [System.Runtime.Intrinsics.X86.Avx2]::IsSupported
            avx512f = [System.Runtime.Intrinsics.X86.Avx512F]::IsSupported
            avx512bw = [System.Runtime.Intrinsics.X86.Avx512BW]::IsSupported
          } | ConvertTo-Json
          uv run --frozen python -c "import openvino as ov; c=ov.Core(); print(ov.__version__); print(c.get_property('CPU','FULL_DEVICE_NAME')); print(c.get_property('CPU','OPTIMIZATION_CAPABILITIES'))"
          $runtime = uv run --frozen python -c "import openvino,pathlib; print(pathlib.Path(openvino.__file__).parent/'libs')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$runtime;$env:PATH"
          # Diagnostic comparison only: the original failing step still fails CI.
          # No ISA restriction is applied to the normal build or shipped runtime.
          $env:ONEDNN_VERBOSE = '1'
          ctest --test-dir build/native -C Release -R '^native_span_blend_cpu$' --verbose
          $nativeStatus = $LASTEXITCODE
          $env:ONEDNN_MAX_CPU_ISA = 'AVX2'
          ctest --test-dir build/native -C Release -R '^native_span_blend_cpu$' --verbose
          [ordered]@{unrestricted_ctest_exit=$nativeStatus;avx2_ctest_exit=$LASTEXITCODE;diagnostic_only=$true} | ConvertTo-Json
          exit 0
      - name: Build start-disabled kernel target and test DDI contracts
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py
      - name: Build optional kernel synchronization probe and test observations
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py --lab-sync-probe --build-dir build/windows-kernel-sync-probe
      - name: Build kernel worker probe and test cleanup contracts
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py --lab-sync-probe --lab-worker-probe --build-dir build/windows-kernel-worker-probe
      - name: Build isolated engine probe with local notification observers
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py --lab-engine-probe --build-dir build/windows-kernel-engine-probe
      - name: Build disposable-VM paging adapter and test startup unwind
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py --lab-paging-adapter --build-dir build/windows-kernel-paging-lab
      - name: Build owned-page translation probe and test mapping contracts
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py --lab-aperture-probe --build-dir build/windows-kernel-aperture-probe
      - name: Build system-page paging adapter and test submitted copies
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_windows_driver.py --lab-aperture-adapter --build-dir build/windows-kernel-aperture-adapter
      - name: Build public KMT paging probe and check adapter enumeration
        if: runner.os == 'Windows'
        run: |
          cmake -S native/windows/paging_probe -B build/windows-paging-probe -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-paging-probe --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-paging-probe -C Release --output-on-failure
      - name: Build registered graphics bridge and test CPU and exchange contracts
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_registered_lab.py --wdk-include-root build/dependencies/wdk-10.0.26100.6584/include
      - name: Verify laboratory cleanup survives report file contention
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\test_lab_report.ps1 -Helper "$pwd\tools\lab_report.ps1"
      - name: Build disposable-guest indirect display diagnostic
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/build_indirect_lab.py
      - name: Package private Windows prototype
        if: runner.os == 'Windows'
        run: uv run --frozen python tools/package_windows.py --ddi --source-revision ${{ github.sha }}
      - name: Retain private Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npu-render-windows-x64
          path: dist/npu-render-windows-x64.zip
          retention-days: 14
          if-no-files-found: error
  weston:
    name: Weston integration (CPU, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          bash .github/install_linux_packages.sh meson ninja-build pkg-config libwayland-dev wayland-protocols libpixman-1-dev libinput-dev libevdev-dev libxkbcommon-dev libudev-dev libdrm-dev libcairo2-dev libpango1.0-dev libpng-dev libseat-dev
          python -m pip install uv==0.11.12
          uv sync --frozen --group native
      - run: uv run --frozen --group native python tools/build_native.py --pixman
      - run: uv run --frozen python tools/build_weston.py
      - run: uv run --frozen python tools/validate_weston.py
      - run: uv run --frozen python tools/validate_weston.py --nested --report results/weston-nested.json
      - run: uv run --frozen python tools/validate_weston.py --transformed --report results/weston-transformed.json
      - run: uv run --frozen python tools/validate_weston.py --resized --report results/weston-resized.json
      - run: uv run --frozen python tools/validate_weston.py --downscaled --report results/weston-downscaled.json
