[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-render"
version = "0.2.0"
description = "Render the Windows desktop on an Intel NPU: a display driver whose compositor draws execute in SHAVE kernels through OpenVINO"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2,<2.5", "openvino==2026.1.0"]

[project.scripts]
npu-render = "npu_render.cli:main"
npu-render-benchmark = "npu_render.benchmark:main"

[project.optional-dependencies]
live = [
    "pygame==2.6.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
native = [
    "cmake>=3.25,<5",
    "ninja>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research/probe.py", "tools/delta/trial-chain", "tools/delta/trial-tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
