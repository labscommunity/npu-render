[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-render"
version = "0.1.0"
description = "Switchable graphics operations across NPU, GPU, and CPU backends"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2,<2.5", "openvino==2026.1.0"]

[project.scripts]
npu-render = "npu_render.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research/probe.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
